[package]
name = "astra-control-plane"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
async-trait = "0.1"
sha2 = "0.10"
argon2 = "0.5"
jsonwebtoken = "9"
rand = "0.8"
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime", "with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
refinery = { version = "0.8", features = ["tokio-postgres"] }
deadpool-postgres = { version = "0.14", features = ["rt_tokio_1"] }
tower-http = { version = "0.5", features = ["fs", "trace"] }
astra-api = { path = "../../crates/astra-api" }
astra-core = { path = "../../crates/astra-core" }
astra-metadata = { path = "../../crates/astra-metadata" }
astra-observability = { path = "../../crates/astra-observability" }
astra-secrets = { path = "../../crates/astra-secrets" }
astra-connectors = { path = "../../crates/astra-connectors" }
astra-runtime = { path = "../../crates/astra-runtime" }
astra-yaml = { path = "../../crates/astra-yaml" }
serde_yaml.workspace = true
casbin = { version = "2.20.0", features = ["runtime-tokio"] }
sqlx-adapter = { version = "1.8.0", features = ["postgres"] }
ldap3 = "0.12"

[dev-dependencies]
testcontainers = "0.17"
testcontainers-modules = { version = "0.5", features = ["postgres"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime", "with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
serde_yaml.workspace = true
