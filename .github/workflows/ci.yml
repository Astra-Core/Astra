name: CI
permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      repo: ${{ steps.filter.outputs.repo }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
            web:
              - 'apps/web/**'
            repo:
              - 'README.md'
              - 'Cargo.toml'
              - '.env.example'
              - 'deploy/**'
              - 'website/docs/**'
            scripts:
              - 'scripts/**'

  repo-sanity:
    name: Repo sanity
    needs: changes
    if: needs.changes.outputs.repo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify core files exist
        run: |
          test -f README.md
          test -f Cargo.toml
          test -f .env.example
          test -f deploy/docker-compose/docker-compose.yml
          test -f website/docs/intro.md
          test -f website/docs/architecture/overview.md
      - name: Print scaffold summary
        run: |
          echo "Astra scaffold present"
          find apps crates -maxdepth 2 -type f | sort

  rust-foundation:
    name: Rust foundation
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Check Rust workspace buildability
        run: cargo check --workspace
      - name: Lint with Clippy
        run: cargo clippy --workspace -- -D warnings

  rust-tests:
    name: Rust tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run workspace tests
        run: cargo test --workspace

  web-foundation:
    name: Web foundation
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Build web app
        run: npm run build

  e2e-snapshot-smoke:
    name: E2E snapshot smoke
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: astra
          POSTGRES_PASSWORD: astra
          POSTGRES_DB: astra
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Run E2E snapshot smoke
        run: python3 scripts/e2e_snapshot_smoke.py
