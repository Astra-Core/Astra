name: CI

on:
  push:
  pull_request:

jobs:
  repo-sanity:
    name: Repo sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify core files exist
        run: |
          test -f README.md
          test -f Cargo.toml
          test -f .env.example
          test -f deploy/docker-compose/docker-compose.yml
          test -f docs/product/brief.md
          test -f docs/architecture/rfc-0001-v1-architecture.md
      - name: Print scaffold summary
        run: |
          echo "Astra scaffold present"
          find apps crates -maxdepth 2 -type f | sort

  rust-foundation:
    name: Rust foundation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Check Rust workspace buildability
        run: cargo check --workspace

  web-foundation:
    name: Web foundation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Build web app
        run: npm run build
